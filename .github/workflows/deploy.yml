name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      - name: Generate NARSLab repositories list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import urllib.request, json, os, sys
          token = os.environ["GH_TOKEN"]
          headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json",
            "User-Agent": "jekyll-build"
          }
          def fetch(url):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req) as r:
              return json.load(r)
          try:
            repos = fetch("https://api.github.com/orgs/NARSLab/repos?per_page=100&type=public")
          except Exception as e:
            print(f"Could not fetch NARSLab repos: {e}", file=sys.stderr)
            repos = []
          matched = []
          for repo in repos:
            try:
              contribs = fetch(f"https://api.github.com/repos/NARSLab/{repo['name']}/contributors?per_page=100")
              if any(c["login"].lower() == "ma-mohammed" for c in contribs):
                matched.append(f"NARSLab/{repo['name']}")
            except Exception:
              pass
          with open("_data/repositories.yml", "w") as f:
            f.write("github_repos:\n")
            for r in matched:
              f.write(f"  - {r}\n")
          print(f"Found {len(matched)} repos: {matched}")
          EOF

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
