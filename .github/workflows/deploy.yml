name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      - name: Generate NARSLab repositories list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import urllib.request, json, os, sys
          token = os.environ["GH_TOKEN"]
          headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json",
            "User-Agent": "jekyll-build"
          }
          def fetch(url):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req) as r:
              return json.load(r)
          try:
            repos = fetch("https://api.github.com/orgs/NARSLab/repos?per_page=100&type=public")
          except Exception as e:
            print(f"Could not fetch NARSLab repos: {e}", file=sys.stderr)
            repos = []
          matched = []
          for repo in repos:
            try:
              contribs = fetch(f"https://api.github.com/repos/NARSLab/{repo['name']}/contributors?per_page=100")
              if any(c["login"].lower() == "ma-mohammed" for c in contribs):
                matched.append({
                  "name": repo["name"],
                  "full_name": repo["full_name"],
                  "description": repo.get("description") or "",
                  "language": repo.get("language") or "",
                  "url": repo["html_url"],
                  "stars": repo.get("stargazers_count", 0),
                  "forks": repo.get("forks_count", 0),
                })
            except Exception:
              pass
          with open("_data/repositories.yml", "w") as f:
            f.write("repos:\n")
            for r in matched:
              f.write(f"  - name: {json.dumps(r['name'])}\n")
              f.write(f"    full_name: {json.dumps(r['full_name'])}\n")
              f.write(f"    description: {json.dumps(r['description'])}\n")
              f.write(f"    language: {json.dumps(r['language'])}\n")
              f.write(f"    url: {json.dumps(r['url'])}\n")
              f.write(f"    stars: {r['stars']}\n")
              f.write(f"    forks: {r['forks']}\n")
          print(f"Found {len(matched)} repos")
          EOF

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
