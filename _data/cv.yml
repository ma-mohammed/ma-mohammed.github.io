- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: University of Massachusetts Amherst, Amherst, MA
      year: Jan 2021 - Present
      description:
        - "<b>Transit OD Inference from Partial Mobile Ticketing Data:</b> Built machine learning framework to infer complete origin-destination-transfer matrices from boarding-only mobile ticketing data in regional bus network with 40+ routes. Developed passenger typology clustering using hierarchical methods and dynamic time warping. Integrated gradient boosting spatial error correction, reducing MAE by 70% and SMAPE by 85%. Funding Pioneer Valley Transit Authority (PVTA), 2021-2023 (PI J. Oke)"
        - "<b>Spatial Crash Typology and Risk Prediction:</b> Applied UMAP and Gaussian mixture models to classify 2,480 census tracts into crash typologies using state-level crash records in New England. Identified distinct spatial patterns linked to roadway characteristics and socioeconomic factors. Built predictive models to forecast crash risk by typology. Funding New England University Transportation Center (NEUTC), 2024-2025 (PI J. Oke)"
        - "<b>Bicycle Infrastructure and Behavior:</b> Designed survey to assess cyclist preferences for map representations and route selection criteria. Analyzing how schematic bicycle maps can influence mode choice and reduce vehicle emissions. Funding Armstrong Fund for Science, 2024-2026 (PI J. Oke)"

